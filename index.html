<style>
  :root{
    --bg:#FAF8F3;
    --surface:#FFFFFF;
    --surface-muted:#F1ECE1;
    --border:#E4DFD1;
    --text:#2B2621;
    --text-muted:#8B8375;
    --ink:#33302B;
    --ink-contrast:#FDFCFA;
    --grade1:#B45309;
    --grade5:#047857;
    --grade6:#1D4ED8;
    --star:#D97706;
    --shadow: rgba(43,38,33,0.07);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1917;
      --surface:#242220;
      --surface-muted:#2B2823;
      --border:#3A362E;
      --text:#EDE8DE;
      --text-muted:#9C9585;
      --ink:#EDE8DE;
      --ink-contrast:#1B1917;
      --grade1:#F59E0B;
      --grade5:#10B981;
      --grade6:#60A5FA;
      --star:#FBBF24;
      --shadow: rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1917;
    --surface:#242220;
    --surface-muted:#2B2823;
    --border:#3A362E;
    --text:#EDE8DE;
    --text-muted:#9C9585;
    --ink:#EDE8DE;
    --ink-contrast:#1B1917;
    --grade1:#F59E0B;
    --grade5:#10B981;
    --grade6:#60A5FA;
    --star:#FBBF24;
    --shadow: rgba(0,0,0,0.4);
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .mono{ font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace; font-variant-numeric:tabular-nums; }

  #app{ max-width:720px; margin:0 auto; padding-bottom:2.5rem; }

  /* app bar */
  .appbar{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    padding:1rem 1.1rem .7rem;
    display:flex; align-items:flex-start; justify-content:space-between; gap:.75rem;
    border-bottom:1px solid transparent;
  }
  .appbar h1{ margin:0; font-size:1.05rem; font-weight:700; letter-spacing:-.01em; }
  .appbar p{ margin:.2rem 0 0; font-size:.78rem; color:var(--text-muted); }
  .print-btn{
    flex:none; display:flex; align-items:center; gap:.35rem;
    background:var(--ink); color:var(--ink-contrast);
    border:none; border-radius:.6rem; padding:.5rem .75rem;
    font-size:.72rem; font-weight:600; cursor:pointer;
    font-family:inherit;
  }
  .print-btn svg{ width:14px; height:14px; }

  /* month tabs */
  .tabs{
    display:flex; gap:.4rem; padding:.3rem 1.1rem .9rem;
    overflow-x:auto; scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex:none; font-family:inherit; font-size:.82rem; font-weight:600;
    padding:.45rem .95rem; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); color:var(--text-muted); cursor:pointer;
  }
  .tab.active{ background:var(--ink); color:var(--ink-contrast); border-color:var(--ink); }

  main{ padding:0 .6rem; }

  /* legend */
  .legend{
    display:flex; flex-wrap:wrap; gap:.5rem .9rem; align-items:center;
    margin:1rem .6rem 0; padding-top:.8rem; border-top:1px solid var(--border);
    font-size:.7rem; color:var(--text-muted);
  }
  .legend-item{ display:flex; align-items:center; gap:.35rem; }
  .dot{ width:.5rem; height:.5rem; border-radius:999px; flex:none; }
  .legend-note{ width:100%; order:5; }

  /* ===== calendar grid — same structure at every width, sized to fit ===== */
  .grid-scroller{
    overflow-x:auto; -webkit-overflow-scrolling:touch;
    background:var(--surface); border:1px solid var(--border); border-radius:1rem;
    padding:.55rem; box-shadow:0 1px 2px var(--shadow);
  }
  .weekday-header, .grid-week{
    display:grid; grid-template-columns:repeat(5, minmax(60px, 1fr));
    gap:.22rem; min-width:300px;
  }
  .weekday-header{
    text-align:center; font-weight:600; font-size:.66rem; color:var(--text-muted);
    background:var(--surface-muted); padding:.35rem 0; border-radius:.5rem; margin-bottom:.3rem;
  }
  .grid-week{ margin-bottom:.22rem; }
  .grid-cell{
    min-height:5.6rem; border-radius:.55rem; border:1px solid var(--border);
    padding:.3rem .2rem; background:var(--surface); overflow:hidden;
  }
  .grid-cell.blank{ background:transparent; border-color:transparent; }
  .grid-date{ font-weight:700; font-size:.7rem; margin-bottom:.2rem; padding-left:.05rem; }
  .grid-period{
    display:flex; align-items:baseline; gap:.1rem;
    font-size:.6rem; line-height:1.5; white-space:nowrap; padding-left:.05rem;
  }
  .grid-period .p{ color:var(--text-muted); font-size:.58rem; flex:none; }
  .grid-period .code{ font-weight:600; overflow:hidden; text-overflow:ellipsis; }
  .grid-period .period-star{ flex:none; }
  .grid-empty{ font-size:.6rem; color:var(--text-muted); padding-left:.05rem; }

  @media (min-width:480px){
    .weekday-header, .grid-week{ grid-template-columns:repeat(5, minmax(70px, 1fr)); gap:.45rem; }
    .grid-cell{ min-height:6.4rem; padding:.45rem .4rem; }
    .grid-date{ font-size:.85rem; }
    .grid-period{ font-size:.72rem; }
    .grid-period .p{ font-size:.66rem; }
  }

  @media print{
    @page{ size:A4 landscape; margin:6mm; }
    body{ background:#fff !important; }
    .no-print{ display:none !important; }
    .grid-scroller{ overflow:visible !important; border:none !important; box-shadow:none !important; padding:0 !important; }
    .weekday-header, .grid-week{ min-width:0 !important; }
    main{ padding:0 !important; }
    #app{ max-width:none !important; padding-bottom:0 !important; }
  }
</style>

        const byPeriod = {};
        classes.forEach(c => { byPeriod[c.p] = c; });
        const maxP = classes.length ? Math.max(...classes.map(c => c.p)) : 0;
        let periods = '';
        for (let p = 1; p <= maxP; p++){
          const c = byPeriod[p];
          periods += c ? `
              <div class="grid-period">
                <span class="p mono">${c.p}</span>
                <span class="code" style="color:${gradeColorVar(c.g)}">${c.t}</span>
                ${c.star ? '<span class="period-star">★</span>' : ''}
              </div>
            ` : '<div class="grid-period grid-period-blank">&nbsp;</div>';
        }
        return `
          <div class="grid-cell">
            <div class="grid-date mono">${d.date}</div>
            ${periods}
          </div>
        `;
      }).join('');
      return `<div class="grid-week">${cells}</div>`;
    }).join('');
    el.innerHTML = header + weeks;
  }

  function changeMonth(month){
    [9, 10, 11, 12].forEach(m => {
      document.getElementById(`tab-${m}`).classList.toggle('active', m === month);
    });
    const data = calendarData[month];
    document.getElementById('month-summary').innerText = data.title;
    renderGrid(month, data);
  }

  const tabs = document.getElementById('tabs');
  tabs.innerHTML = [9,10,11,12].map(m => `<button class="tab" id="tab-${m}" onclick="changeMonth(${m})">${m}월</button>`).join('');

  changeMonth(9);
</script>
